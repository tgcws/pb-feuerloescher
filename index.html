<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prüfbericht Feuerlöscher</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#d6001c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Feuerlöscher" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{
      --brand:#d6001c;
      --brand-dark:#a80016;
      --bg:#f4f4f6;
      --card:#ffffff;
      --field:#f2f2f7;
      --text:#1c1c1e;
      --muted:#6e6e73;
      --line:#ffffff;
      --radius:16px;
      --shadow:0 8px 28px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box;}

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
      margin:0;
      padding:18px;
      padding-left:max(18px, env(safe-area-inset-left));
      padding-right:max(18px, env(safe-area-inset-right));
      background:var(--bg);
      color:var(--text);
    }

    .container{
      width:min(100%, 1440px);
      margin:0 auto;
      background:var(--card);
      padding:20px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .title-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    h1{
      font-size:clamp(24px, 3.2vw, 36px);
      line-height:1.1;
      margin:0;
      letter-spacing:-.02em;
    }

    .header-left{
      width:100%;
    }

    .header-row{
      display:grid;
      grid-template-columns:repeat(3, minmax(180px, 1fr));
      gap:12px;
      margin-bottom:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    label{
      font-size:15px;
      font-weight:700;
      margin:0 0 6px;
      color:var(--muted);
    }

    input[type="text"],
    input[type="date"],
    textarea,
    select{
      width:100%;
      min-height:44px;
      border:0;
      border-radius:12px;
      background:var(--field);
      color:var(--text);
      font-size:17px;
      font-weight:650;
      padding:10px 12px;
      outline:none;
      -webkit-tap-highlight-color:transparent;
    }

    input:focus,
    textarea:focus,
    select:focus{
      box-shadow:0 0 0 3px rgba(214,0,28,.18);
    }

    select{
      appearance:auto;
      font-size:15px;
      padding:8px 10px;
    }

    .table-wrapper{
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      border-radius:14px;
      background:#fff;
    }

    table{
      width:100%;
      min-width:1320px;
      border-collapse:separate;
      border-spacing:0;
      margin-top:16px;
      table-layout:fixed;
    }

    th, td{
      border:2px solid var(--line);
      background:#f5f5f5;
      padding:8px;
      text-align:center;
      vertical-align:middle;
    }

    th{
      background:var(--brand);
      color:#fff;
      font-size:13px;
      line-height:1.15;
      font-weight:800;
      white-space:normal;
    }

    td input[type="text"]{
      width:100%;
      font-size:14px;
      min-height:40px;
      padding:8px;
    }

    .col-pos{width:58px;}
    .col-standort{width:260px;}
    .col-typ{width:90px;}
    .col-baujahr{width:85px;}
    .col-status{width:118px;}
    .col-kurz{width:94px;}
    .col-loeschmittel{width:120px;}

    .pos-field{
      text-align:center;
      font-weight:800;
    }

    .standort-field{
      min-width:0;
      text-align:left;
    }

    .type-field,
    .baujahr-field,
    .loeschmittel-field{
      text-align:center;
    }

    .checkbox-center{
      text-align:center;
    }

    input[type="checkbox"]{
      -webkit-appearance:checkbox !important;
      appearance:checkbox !important;
      width:28px;
      height:28px;
      cursor:pointer;
      accent-color:var(--brand);
    }

    .actions,
    .signature-actions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      background:var(--brand);
      color:white;
      border:0;
      padding:14px 18px;
      border-radius:999px;
      cursor:pointer;
      font-size:16px;
      font-weight:800;
      min-height:48px;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    button:hover{background:var(--brand-dark);}
    button:active{transform:scale(.98);}

    button.secondary{
      background:#3a3a3c;
    }

    button.secondary:hover{
      background:#1c1c1e;
    }

    button.danger{
      background:#8e8e93;
    }

    button.danger:hover{
      background:#636366;
    }

    .signature-block{
      margin-top:28px;
    }

    .signature-block h3{
      margin:0 0 10px;
      font-size:20px;
    }

    #signaturePad{
      border:1.5px solid #d1d1d6;
      border-radius:14px;
      width:100%;
      max-width:620px;
      height:180px;
      touch-action:none;
      background:#fff;
      display:block;
    }

    .hint{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
    }

    @media (max-width: 900px){
      body{padding:12px;}
      .container{padding:14px;border-radius:14px;}
      .header-row{grid-template-columns:1fr 1fr;gap:10px;}
      .field.full-mobile{grid-column:1 / -1;}
      table{min-width:1180px;}
      th{font-size:12px;}
      button{width:100%;}
      .actions,.signature-actions{display:grid;grid-template-columns:1fr 1fr;}
      .actions button:nth-child(3),.actions button:nth-child(4){grid-column:auto;}
    }

    @media (max-width: 520px){
      .header-row{grid-template-columns:1fr;}
      .actions,.signature-actions{grid-template-columns:1fr;}
    }

    @page{
      size:A4 landscape;
      margin:8mm;
    }

    @media print{
      html, body{
        margin:0 !important;
        padding:0 !important;
        background:white !important;
      }

      *{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
        color-adjust:exact !important;
      }

      .actions,
      .signature-actions,
      .hint{
        display:none !important;
      }

      .container{
        width:100%;
        box-shadow:none;
        border-radius:0;
        padding:0;
      }

      .table-wrapper{
        overflow:visible;
        border-radius:0;
      }

      table{
        min-width:0;
        width:100%;
        border-collapse:collapse;
        table-layout:fixed;
      }

      th,td{
        border:1px solid #fff !important;
        border-radius:0 !important;
        padding:4px !important;
        font-size:9px !important;
        line-height:1.15 !important;
      }

      th{
        background:#d9d9de !important;
        color:#000 !important;
      }

      td{
        background:#f2f2f7 !important;
      }

      input,select{
        min-height:0 !important;
        padding:0 !important;
        border-radius:0 !important;
        background:transparent !important;
        box-shadow:none !important;
        font-size:9px !important;
      }
    }
  </style>
</head>

<body>
  <div class="container" id="reportRoot">
    <div class="title-bar">
      <h1>Prüfbericht Feuerlöscher</h1>
    </div>

    <div class="header-left">
      <div class="header-row">
        <div class="field">
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" placeholder="Name eingeben" autocomplete="off" />
        </div>

        <div class="field">
          <label for="objectInput">Objekt</label>
          <input id="objectInput" type="text" placeholder="Objekt eingeben" autocomplete="off" />
        </div>

        <div class="field full-mobile">
          <label for="dateInput">Datum</label>
          <input id="dateInput" type="date" />
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="reportTable" aria-label="Prüfbericht Feuerlöscher Tabelle">
        <thead>
          <tr>
            <th class="col-pos">Pos.</th>
            <th class="col-standort">Standort</th>
            <th class="col-typ">Typ</th>
            <th class="col-baujahr">Baujahr</th>
            <th class="col-status">Außeninspektion</th>
            <th class="col-status">Innenkontrolle</th>
            <th class="col-status">BetrSichV<br>Kategorie I-II</th>
            <th class="col-status">Schlauchprüfung</th>
            <th class="col-kurz">Reinigung</th>
            <th class="col-status">Druck-/Dichtheit</th>
            <th class="col-loeschmittel">Löschmittel<br>Tausch bis</th>
            <th class="col-kurz">Prüfplakette</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button type="button" onclick="addRow()">Zeile hinzufügen</button>
      <button type="button" onclick="removeRow()" class="secondary">Letzte Zeile entfernen</button>
      <button type="button" onclick="exportPdf()">PDF</button>
      <button type="button" onclick="clearForm()" class="danger">Leeren</button>
    </div>

    <div class="signature-block">
      <h3>Digitale Unterschrift</h3>
      <canvas id="signaturePad" aria-label="Digitale Unterschrift"></canvas>
      <div class="signature-actions">
        <button type="button" onclick="clearSignature()" class="secondary">Unterschrift löschen</button>
      </div>
      <div class="hint">Tipp: Auf dem iPad mit Finger oder Apple Pencil unterschreiben.</div>
    </div>
  </div>

  <script>
    const PDF_HEADERS = [
      'Pos.', 'Standort', 'Typ', 'Baujahr', 'Außeninspektion', 'Innenkontrolle',
      'BetrSichV\nKategorie I-II', 'Schlauchprüfung', 'Reinigung', 'Druck-/Dichtheit',
      'Löschmittel\nTausch bis', 'Prüfplakette'
    ];


    const STORAGE_KEY = 'pb-feuerloescher-report-v1';
    let storageRestoreInProgress = false;
    let storageSaveTimer = null;

    function createSelect(options){
      const select = document.createElement('select');
      options.forEach(optionText => {
        const option = document.createElement('option');
        option.value = optionText;
        option.text = optionText;
        select.add(option);
      });
      return select;
    }

    function updatePositionNumbers(){
      document.querySelectorAll('#tableBody tr').forEach((row, index) => {
        const pos = row.querySelector('.pos-field');
        if(pos) pos.value = index + 1;
      });
    }

    function addRow(){
      const tableBody = document.getElementById('tableBody');
      const row = document.createElement('tr');

      row.innerHTML = `
        <td><input type="text" class="pos-field" readonly aria-label="Position"></td>
        <td><input type="text" class="standort-field" placeholder="Standort eingeben" autocomplete="off" aria-label="Standort"></td>
        <td><input type="text" class="type-field" autocomplete="off" aria-label="Typ"></td>
        <td><input type="text" class="baujahr-field" inputmode="numeric" autocomplete="off" aria-label="Baujahr"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="checkbox-center"><input type="checkbox" aria-label="Reinigung"></td>
        <td></td>
        <td><input type="text" class="loeschmittel-field" autocomplete="off" aria-label="Löschmittel Tausch bis"></td>
        <td class="checkbox-center"><input type="checkbox" aria-label="Prüfplakette"></td>
      `;

      row.cells[4].appendChild(createSelect(['I.O', 'n.i.O']));
      row.cells[5].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));
      row.cells[6].appendChild(createSelect(['I.O', 'n.i.O']));
      row.cells[7].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));
      row.cells[9].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));

      tableBody.appendChild(row);
      updatePositionNumbers();
      scheduleStorageSave();
    }

    function removeRow(){
      const tableBody = document.getElementById('tableBody');
      if(tableBody.rows.length > 1){
        tableBody.deleteRow(tableBody.rows.length - 1);
      }
      updatePositionNumbers();
      scheduleStorageSave();
    }

    function clearForm(){
      const shouldClear = confirm('Alle Eingaben wirklich löschen?');
      if(!shouldClear) return;

      document.querySelectorAll('input[type="text"], input[type="date"], textarea').forEach(input => {
        input.value = '';
      });
      document.querySelectorAll('select').forEach(select => {
        select.selectedIndex = 0;
      });
      document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = false;
      });

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      addRow();
      clearSignature(true);
      try{ localStorage.removeItem(STORAGE_KEY); }catch(error){}
    }

    function getCellValue(cell){
      const checkbox = cell.querySelector('input[type="checkbox"]');
      if(checkbox) return checkbox.checked ? 'Ja' : '';

      const select = cell.querySelector('select');
      if(select) return select.options[select.selectedIndex]?.text || select.value || '';

      const input = cell.querySelector('input, textarea');
      if(input) return String(input.value || '').trim();

      return String(cell.textContent || '').trim();
    }

    function getTableData(){
      return Array.from(document.querySelectorAll('#tableBody tr')).map(row => {
        return Array.from(row.cells).map(getCellValue);
      });
    }


    function getCellInput(cell){
      return cell.querySelector('input[type="checkbox"], select, input, textarea');
    }

    function setCellValue(cell, value){
      const field = getCellInput(cell);
      if(!field) return;

      if(field.type === 'checkbox'){
        field.checked = value === true || value === 'true' || value === 'Ja';
        return;
      }

      if(field.tagName === 'SELECT'){
        const valueText = String(value || '');
        const optionIndex = Array.from(field.options).findIndex(option => option.value === valueText || option.text === valueText);
        field.selectedIndex = optionIndex >= 0 ? optionIndex : 0;
        return;
      }

      field.value = value == null ? '' : String(value);
    }

    function getStorageSignature(){
      const canvas = document.getElementById('signaturePad');
      if(!canvas || isCanvasBlank(canvas)) return '';
      try{ return canvas.toDataURL('image/png'); }catch(error){ return ''; }
    }

    function buildStoragePayload(){
      return {
        name: document.getElementById('nameInput')?.value || '',
        object: document.getElementById('objectInput')?.value || '',
        date: document.getElementById('dateInput')?.value || '',
        rows: getTableData(),
        signature: getStorageSignature(),
        savedAt: new Date().toISOString()
      };
    }

    function saveToStorageNow(){
      if(storageRestoreInProgress) return;
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStoragePayload()));
      }catch(error){
        console.warn('Eingaben konnten nicht lokal gespeichert werden:', error);
      }
    }

    function scheduleStorageSave(){
      if(storageRestoreInProgress) return;
      window.clearTimeout(storageSaveTimer);
      storageSaveTimer = window.setTimeout(saveToStorageNow, 180);
    }

    function restoreSignatureFromStorage(signatureData){
      if(!signatureData || !signaturePadState.ctx || !signaturePadState.canvas) return;

      const canvas = signaturePadState.canvas;
      const ctx = signaturePadState.ctx;
      const rect = canvas.getBoundingClientRect();
      const image = new Image();
      image.onload = () => {
        ctx.drawImage(image, 0, 0, rect.width, rect.height);
      };
      image.src = signatureData;
    }

    function restoreFromStorage(){
      let saved = null;
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        saved = raw ? JSON.parse(raw) : null;
      }catch(error){
        console.warn('Gespeicherte Eingaben konnten nicht geladen werden:', error);
      }

      storageRestoreInProgress = true;

      document.getElementById('nameInput').value = saved?.name || '';
      document.getElementById('objectInput').value = saved?.object || '';
      document.getElementById('dateInput').value = saved?.date || '';

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      const rows = Array.isArray(saved?.rows) && saved.rows.length ? saved.rows : [[]];
      rows.forEach(rowValues => {
        addRow();
        const row = tableBody.rows[tableBody.rows.length - 1];
        Array.from(row.cells).forEach((cell, index) => {
          setCellValue(cell, rowValues[index]);
        });
      });
      updatePositionNumbers();

      storageRestoreInProgress = false;
      if(saved?.signature){
        window.setTimeout(() => restoreSignatureFromStorage(saved.signature), 80);
      }
    }

    function formatDateForFile(dateValue){
      if(!dateValue) return new Date().toLocaleDateString('de-DE').replaceAll('.', '-');
      const [year, month, day] = dateValue.split('-');
      return `${day}.${month}.${year}`;
    }

    function sanitizeFileName(value){
      return (value || 'Pruefbericht-Feuerloescher')
        .trim()
        .replace(/[\\/:*?"<>|]+/g, '-')
        .replace(/\s+/g, '_')
        .slice(0, 80) || 'Pruefbericht-Feuerloescher';
    }

    function getPdfFileName(){
      const objectName = sanitizeFileName(document.getElementById('objectInput').value);
      const dateName = formatDateForFile(document.getElementById('dateInput').value);
      return `${objectName}_${dateName}.pdf`;
    }

    function ensureJsPdf(){
      if(window.jspdf && typeof window.jspdf.jsPDF === 'function') return window.jspdf.jsPDF;
      if(typeof window.jsPDF === 'function') return window.jsPDF;
      return null;
    }

    async function loadJsPdfIfNeeded(){
      const existing = ensureJsPdf();
      if(existing) return existing;

      return new Promise(resolve => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        script.onload = () => resolve(ensureJsPdf());
        script.onerror = () => resolve(null);
        document.head.appendChild(script);
      });
    }

    function savePdfDocument(doc, fileName){
      try{
        doc.save(fileName);
      }catch(error){
        try{
          const blob = doc.output('blob');
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }catch(secondError){
          alert('PDF konnte nicht gespeichert werden. Bitte im Browser erneut öffnen und noch einmal versuchen.');
        }
      }
    }

    function normalizePdfText(value){
      return String(value || '')
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/\u2713/g, 'Ja')
        .trim();
    }

    async function exportPdf(){
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }

      const pdfButton = Array.from(document.querySelectorAll('button')).find(button => button.textContent.trim() === 'PDF');
      const originalButtonText = pdfButton ? pdfButton.textContent : '';
      if(pdfButton){
        pdfButton.disabled = true;
        pdfButton.textContent = 'PDF wird erstellt…';
      }

      try{
        const JsPDF = await loadJsPdfIfNeeded();
        if(!JsPDF){
          alert('PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und erneut versuchen.');
          return;
        }

        const doc = new JsPDF({ orientation:'landscape', unit:'mm', format:'a4', compress:true });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 7;
        const usableWidth = pageWidth - margin * 2;
        const objectName = normalizePdfText(document.getElementById('objectInput').value);
        const dateValue = document.getElementById('dateInput').value || '';
        const nameValue = normalizePdfText(document.getElementById('nameInput').value);
        const dateText = dateValue ? formatDateForFile(dateValue) : '';
        const fileName = getPdfFileName();
        const rowData = getTableData();

        // Breiten sind bewusst auf Lesbarkeit und sichtbare Eingaben optimiert.
        // Die Summe wird anschließend exakt auf die A4-Querformat-Seite skaliert.
        const baseWidths = [11, 55, 20, 18, 25, 25, 27, 25, 19, 25, 27, 21];
        const totalBaseWidth = baseWidths.reduce((sum, width) => sum + width, 0);
        const widths = baseWidths.map(width => width * usableWidth / totalBaseWidth);
        const tableX = margin;
        const headerHeight = 12;
        const lineHeight = 3.25;
        const minRowHeight = 9.5;
        const maxRowHeight = 31;
        const footerReserve = 34;
        const tableStartY = 25;

        function drawMetaField(label, value, x, y, maxValueWidth){
          doc.setTextColor(18, 18, 18);
          doc.setFont('helvetica', 'bold');
          doc.text(label, x, y);

          doc.setFont('helvetica', 'normal');
          const labelWidth = doc.getTextWidth(label + ' ');
          const safeValue = normalizePdfText(value || '-');
          const lines = doc.splitTextToSize(safeValue, maxValueWidth);
          doc.text(lines.slice(0, 1), x + labelWidth, y);
        }

        function drawPageHeader(){
          doc.setTextColor(18, 18, 18);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(14);
          doc.text('Prüfbericht Feuerlöscher', margin, 11);

          doc.setFontSize(8.6);
          drawMetaField('Name:', nameValue || '-', margin, 18, 37);
          drawMetaField('Objekt:', objectName || '-', margin + 92, 18, 42);
          drawMetaField('Datum:', dateText || '-', margin + 192, 18, 40);
        }

        function drawCellBackground(x, y, width, height, fillColor){
          // Hex-Farben plus getrenntes Füllen/Zeichnen verhindern schwarze Tabellenfelder in Safari/iPad und einzelnen PDF-Viewern.
          doc.setFillColor(fillColor);
          doc.rect(x, y, width, height, 'F');
          doc.setDrawColor('#ffffff');
          doc.setLineWidth(0.45);
          doc.rect(x, y, width, height, 'S');
        }

        function drawTableHeader(y){
          let x = tableX;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(6.8);

          PDF_HEADERS.forEach((header, index) => {
            drawCellBackground(x, y, widths[index], headerHeight, '#d6001c');
            doc.setTextColor('#ffffff');
            const lines = String(header).split('\n');
            const firstLineY = y + (lines.length === 1 ? 7.3 : 5.0);
            lines.forEach((line, lineIndex) => {
              doc.setTextColor('#ffffff');
              doc.text(line, x + widths[index] / 2, firstLineY + lineIndex * 3.2, {align:'center'});
            });
            x += widths[index];
          });
          return y + headerHeight;
        }

        function getWrappedLines(text, columnIndex){
          const value = normalizePdfText(text);
          const innerWidth = Math.max(3, widths[columnIndex] - 2.2);
          if(!value) return [''];
          return doc.splitTextToSize(value, innerWidth);
        }

        function calculateRowHeight(row){
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.4);
          const maxLines = row.reduce((max, cell, index) => {
            return Math.max(max, getWrappedLines(cell, index).length);
          }, 1);
          return Math.min(maxRowHeight, Math.max(minRowHeight, 4.5 + maxLines * lineHeight));
        }

        function drawTableRow(row, y, rowHeight){
          let x = tableX;
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.4);

          row.forEach((cell, index) => {
            drawCellBackground(x, y, widths[index], rowHeight, '#f5f5f5');
            doc.setTextColor('#000000');
            const lines = getWrappedLines(cell, index);
            const maxVisibleLines = Math.max(1, Math.floor((rowHeight - 3) / lineHeight));
            const visibleLines = lines.slice(0, maxVisibleLines);
            if(lines.length > maxVisibleLines && visibleLines.length){
              const lastIndex = visibleLines.length - 1;
              visibleLines[lastIndex] = `${String(visibleLines[lastIndex]).replace(/\.{3}$/,'')}...`;
            }

            const align = index === 1 ? 'left' : 'center';
            const textX = align === 'left' ? x + 1.25 : x + widths[index] / 2;
            const textBlockHeight = (visibleLines.length - 1) * lineHeight;
            const startY = y + Math.max(4.6, (rowHeight - textBlockHeight) / 2 + 1.2);

            visibleLines.forEach((line, lineIndex) => {
              doc.setTextColor('#000000');
              doc.text(String(line), textX, startY + lineIndex * lineHeight, {align});
            });
            x += widths[index];
          });
        }

        function addNewTablePage(){
          doc.addPage('a4', 'landscape');
          drawPageHeader();
          return drawTableHeader(tableStartY);
        }

        drawPageHeader();
        let y = drawTableHeader(tableStartY);
        let bottomLimit = pageHeight - margin - footerReserve;

        rowData.forEach(row => {
          const rowHeight = calculateRowHeight(row);
          if(y + rowHeight > bottomLimit){
            y = addNewTablePage();
          }
          drawTableRow(row, y, rowHeight);
          y += rowHeight;
        });

        const signatureCanvas = document.getElementById('signaturePad');
        const signatureHasContent = signatureCanvas && !isCanvasBlank(signatureCanvas);
        if(y + footerReserve > pageHeight - margin){
          doc.addPage('a4', 'landscape');
          drawPageHeader();
          y = 29;
        }

        y += 7;

        if(signatureHasContent){
          try{
            const signatureData = signatureCanvas.toDataURL('image/png');
            doc.addImage(signatureData, 'PNG', margin, y, 55, 20, undefined, 'FAST');
          }catch(error){
            doc.setTextColor(0, 0, 0);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7);
            doc.text('Unterschrift konnte nicht eingebettet werden.', margin, y + 8);
          }
        }

        doc.setDrawColor(155, 155, 160);
        doc.setLineWidth(0.3);
        doc.line(margin, y + 24, margin + 70, y + 24);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7);
        doc.text('Unterschrift', margin, y + 28);

        savePdfDocument(doc, fileName);
      }catch(error){
        console.error('PDF-Export fehlgeschlagen:', error);
        alert('PDF konnte nicht erstellt werden. Bitte Seite neu laden und erneut versuchen.');
      }finally{
        if(pdfButton){
          pdfButton.disabled = false;
          pdfButton.textContent = originalButtonText;
        }
      }
    }

    let signaturePadState = {
      canvas:null,
      ctx:null,
      isDrawing:false,
      lastPoint:null
    };

    function setupSignatureCanvas(){
      const canvas = document.getElementById('signaturePad');
      if(!canvas) return;

      const oldData = signaturePadState.canvas && !isCanvasBlank(signaturePadState.canvas)
        ? signaturePadState.canvas.toDataURL('image/png')
        : null;

      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);

      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#222';

      signaturePadState.canvas = canvas;
      signaturePadState.ctx = ctx;

      if(oldData){
        const image = new Image();
        image.onload = () => ctx.drawImage(image, 0, 0, rect.width, rect.height);
        image.src = oldData;
      }
    }

    function getSignaturePoint(event){
      const canvas = signaturePadState.canvas;
      const rect = canvas.getBoundingClientRect();
      return {
        x:event.clientX - rect.left,
        y:event.clientY - rect.top
      };
    }

    function startSignature(event){
      event.preventDefault();
      const canvas = signaturePadState.canvas;
      if(!canvas || !signaturePadState.ctx) return;

      signaturePadState.isDrawing = true;
      signaturePadState.lastPoint = getSignaturePoint(event);

      if(canvas.setPointerCapture){
        canvas.setPointerCapture(event.pointerId);
      }
    }

    function drawSignature(event){
      if(!signaturePadState.isDrawing || !signaturePadState.ctx) return;
      event.preventDefault();

      const ctx = signaturePadState.ctx;
      const currentPoint = getSignaturePoint(event);
      const lastPoint = signaturePadState.lastPoint || currentPoint;

      ctx.beginPath();
      ctx.moveTo(lastPoint.x, lastPoint.y);
      ctx.lineTo(currentPoint.x, currentPoint.y);
      ctx.stroke();

      signaturePadState.lastPoint = currentPoint;
    }

    function stopSignature(event){
      if(!signaturePadState.isDrawing) return;
      signaturePadState.isDrawing = false;
      signaturePadState.lastPoint = null;

      const canvas = signaturePadState.canvas;
      if(canvas && canvas.releasePointerCapture && event && event.pointerId){
        try{ canvas.releasePointerCapture(event.pointerId); }catch(error){}
      }
      scheduleStorageSave();
    }

    function clearSignature(skipStorageSave = false){
      const canvas = signaturePadState.canvas || document.getElementById('signaturePad');
      if(!canvas) return;

      const ctx = signaturePadState.ctx || canvas.getContext('2d');
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      if(!skipStorageSave) scheduleStorageSave();
    }

    function isCanvasBlank(canvas){
      const context = canvas.getContext('2d');
      const pixelBuffer = new Uint32Array(
        context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
      );
      return !pixelBuffer.some(color => color !== 0);
    }

    function initSignature(){
      setupSignatureCanvas();
      const canvas = signaturePadState.canvas;
      if(!canvas) return;

      canvas.addEventListener('pointerdown', startSignature, {passive:false});
      canvas.addEventListener('pointermove', drawSignature, {passive:false});
      canvas.addEventListener('pointerup', stopSignature);
      canvas.addEventListener('pointercancel', stopSignature);
      canvas.addEventListener('pointerleave', stopSignature);
    }

    function registerServiceWorker(){
      if(!('serviceWorker' in navigator)) return;

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register('./service-worker.js').then(registration => {
        registration.update();

        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if(!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
              newWorker.postMessage({type:'SKIP_WAITING'});
            }
          });
        });

        window.addEventListener('focus', () => registration.update());
        setInterval(() => registration.update(), 60 * 60 * 1000);
      }).catch(error => console.warn('Service Worker konnte nicht registriert werden:', error));
    }

    window.addEventListener('load', () => {
      initSignature();
      restoreFromStorage();

      document.addEventListener('input', scheduleStorageSave, true);
      document.addEventListener('change', scheduleStorageSave, true);

      registerServiceWorker();
    });

    window.addEventListener('resize', () => {
      window.clearTimeout(window.__signatureResizeTimer);
      window.__signatureResizeTimer = window.setTimeout(setupSignatureCanvas, 180);
    });
  </script>
</body>
</html>

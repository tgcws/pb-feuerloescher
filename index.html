<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prüfbericht Feuerlöscher</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6001c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
#signaturePad{
  border:2px solid #ccc;
  border-radius:8px;
  width:100%;
  max-width:500px;
  height:180px;
  touch-action:none;
  background:#fff;
  display:block;
  box-sizing:border-box;
}
.signature-actions{
  margin-top:10px;
}
</style>


  <style>
    body{
      font-family: Arial, sans-serif;
      margin:20px;
      background:#f4f4f4;
      color:#222;
    }

    .container{
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h1{
      text-align:left;
      margin-bottom:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    
    .title-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }
    .header-left{
      flex:1;
      min-width:250px;
    }

    .header-row{
      display:flex;
      gap:15px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .field{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:150px;
    }

    label{
      font-size:18px;
      font-weight:bold;
      margin-bottom:5px;
    }

    input[type="text"],
    input[type="date"],
    textarea,
    select{
      border:none;
      border-radius:8px;
      font-size:18px;
      box-sizing:border-box;
    }

    input[type="text"],
    input[type="date"],
    textarea{
      padding:8px;
    }

    /* Dropdowns */
    select{
      padding:5px 10px;
      min-width:90px;
      height:36px;
      font-size:14px;  
	  font-weight:bold;

    }

    .table-wrapper{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:25px;
      min-width:1750px;
    }

    th, td{
      border:2px solid #FFFFFF;
	  border-radius:5px;
      background:#F5F5F5;
      padding:15px;
      text-align:center;
      vertical-align:middle;
    }

    th{
      background:#d6001c;
      color:white;
      font-size:15px;
      white-space:normal;
    }

    td input[type="text"]{
      width:100%;
      padding:10px;
	  font-size:14px;	  
	  font-weight:bold;
    }

    /* POS Feld */
    .pos-field{
      width:35px !important;
      text-align:center;
      font-weight:bold;
    }

    /* Baujahr Feld */
    .baujahr-field{
      width:80px !important;
      text-align:center;
      font-weight:bold;
    }
	
    /* Löschmittel Feld */
    .loeschmittel-field{
      width:100px !important;
      text-align:center;
      font-weight:bold;
    }
	
    /* Standortfeld */
    .standort-field{
      min-width:290px;
      resize:horizontal;
      overflow:auto;
    }
	
    /* Typ Feld */
    .type-field{
      width:85px !important;
      text-align:center;
      font-weight:bold;
    }

    .checkbox-center{
      text-align:center;
    }

    .actions{
      margin-top:20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      background:#d6001c;
      color:white;
      border:none;
      padding:16px 14px;
      border-radius:23px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    button:hover{
      background:#a80016;
    }

    @page{
      size: landscape;
      margin: 0;
    }
	
	@media print {
	    html, body {
			margin: 0 !important;
			padding: 0 !important;
        }

	 *{
	   -webkit-print-color-adjust: exact !important;
	   print-color-adjust: exact !important;
	   color-adjust: exact !important;
     }

	 th{
      background: #d6001c !important;
      color: #ffffff !important;
     }

     td{
      background: #F5F5F5 !important;
     }

     button{
      display:none;
     }

     body{
      background:white;
     }

     .container{
      box-shadow:none;
     }
    }
  
input[type="checkbox"]{
  -webkit-appearance: checkbox !important;
  appearance: checkbox !important;
  width: 28px;
  height: 28px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

  <div class="title-bar">
    <h1>Prüfbericht Feuerlöscher</h1>
  </div>

  <div class="header-left">

    <div class="header-left">

      <div class="header-row">
        <div class="field">
          <label>Objekt</label>
          <input type="text" placeholder="Objekt eingeben">
        </div>

        <div class="field">
          <label>Datum</label>
          <input type="date">
        </div>
      </div>

      <div class="header-row">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Name eingeben">
        </div>
      </div>

    </div>

  </div>

  <div class="table-wrapper">

    <table id="reportTable">

      <thead>
        <tr>
          <th>Pos.</th>
          <th>Standort</th>
          <th>Typ</th>
          <th>Baujahr</th>

          <th>Außeninspektion</th>

          <th>Innenkontrolle</th>

          <th>BetrSichV<br>Kategorie I-II</th>

          <th>Schlauchprüfung</th>

          <th>Reinigung</th>

          <th>Druck-/Dichtheit</th>

          <th>Löschmittel<br>Tausch bis</th>

          <th>Prüfplakette</th>
        </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>

    </table>

  </div>

  <div class="actions">
    <button onclick="addRow()">Zeile hinzufügen</button>
    <button onclick="removeRow()">Letzte Zeile entfernen</button>
    <button onclick="printReport()">Drucken</button>
  </div>

  
<div style="margin-top:30px">
  <h3>Digitale Unterschrift</h3>
  <canvas id="signaturePad" aria-label="Digitale Unterschrift"></canvas>
  <div class="signature-actions">
    <button type="button" onclick="clearSignature()">Unterschrift löschen</button>
  </div>
</div>

<script>

  function createSelect(options) {

    let select = document.createElement("select");

    options.forEach(optionText => {
      let option = document.createElement("option");
      option.text = optionText;
      select.add(option);
    });

    return select;
  }

  function updatePositionNumbers() {

    const rows = document.querySelectorAll("#tableBody tr");

    rows.forEach((row, index) => {
      row.querySelector(".pos-field").value = index + 1;
    });
  }

  function addRow() {

    const tableBody = document.getElementById("tableBody");

    let row = document.createElement("tr");

    row.innerHTML = `
      <td>
        <input type="text" class="pos-field" readonly>
      </td>

      <td>
        <input type="text"
               class="standort-field"
               placeholder="Standort eingeben">
      </td>

      <td>
        <input type="text"
			   class="type-field">
      </td>

      <td>
        <input type="text"
			   class="baujahr-field">
      </td>

      <td></td>
      <td></td>
      <td></td>
      <td></td>

      <td class="checkbox-center">
        <input type="checkbox">
      </td>

      <td></td>
      <td>
        <input type="text"
               class="loeschmittel-field">
      </td>

      <td class="checkbox-center">
        <input type="checkbox">
      </td>
    `;

    row.cells[4].appendChild(
      createSelect(["I.O", "n.i.O"])
    );

    row.cells[5].appendChild(
      createSelect(["I.O", "n.i.O", "n.n"])
    );

    row.cells[6].appendChild(
      createSelect(["I.O", "n.i.O"])
    );

    row.cells[7].appendChild(
      createSelect(["I.O", "n.i.O", "n.n"])
    );

    row.cells[9].appendChild(
      createSelect(["I.O", "n.i.O", "n.n"])
    );

    tableBody.appendChild(row);

    updatePositionNumbers();
  }

  function removeRow() {

    const tableBody = document.getElementById("tableBody");

    if (tableBody.rows.length > 1) {
      tableBody.deleteRow(tableBody.rows.length - 1);
    }

    updatePositionNumbers();
  }

  function printReport() {
    window.print();
  }

  // Erste Zeile automatisch erzeugen
  addRow();

</script>

<script>
let reports=JSON.parse(localStorage.getItem('reports')||'[]');

let signaturePadState = {
  canvas: null,
  ctx: null,
  isDrawing: false,
  lastPoint: null
};

function setupSignatureCanvas(){
  const canvas = document.getElementById('signaturePad');
  if(!canvas) return;

  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.max(window.devicePixelRatio || 1, 1);

  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#222';

  signaturePadState.canvas = canvas;
  signaturePadState.ctx = ctx;
}

function getSignaturePoint(event){
  const canvas = signaturePadState.canvas;
  const rect = canvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

function startSignature(event){
  event.preventDefault();
  const canvas = signaturePadState.canvas;
  if(!canvas || !signaturePadState.ctx) return;

  signaturePadState.isDrawing = true;
  signaturePadState.lastPoint = getSignaturePoint(event);

  if(canvas.setPointerCapture){
    canvas.setPointerCapture(event.pointerId);
  }
}

function drawSignature(event){
  if(!signaturePadState.isDrawing || !signaturePadState.ctx) return;
  event.preventDefault();

  const ctx = signaturePadState.ctx;
  const currentPoint = getSignaturePoint(event);
  const lastPoint = signaturePadState.lastPoint || currentPoint;

  ctx.beginPath();
  ctx.moveTo(lastPoint.x, lastPoint.y);
  ctx.lineTo(currentPoint.x, currentPoint.y);
  ctx.stroke();

  signaturePadState.lastPoint = currentPoint;
}

function stopSignature(event){
  if(!signaturePadState.isDrawing) return;
  signaturePadState.isDrawing = false;
  signaturePadState.lastPoint = null;

  const canvas = signaturePadState.canvas;
  if(canvas && canvas.releasePointerCapture && event && event.pointerId){
    try{
      canvas.releasePointerCapture(event.pointerId);
    }catch(error){}
  }
}

function initSignature(){
  setupSignatureCanvas();
  const canvas = signaturePadState.canvas;
  if(!canvas) return;

  canvas.addEventListener('pointerdown', startSignature);
  canvas.addEventListener('pointermove', drawSignature);
  canvas.addEventListener('pointerup', stopSignature);
  canvas.addEventListener('pointercancel', stopSignature);
  canvas.addEventListener('pointerleave', stopSignature);
}

function clearSignature(){
  const canvas = signaturePadState.canvas || document.getElementById('signaturePad');
  if(!canvas) return;

  const ctx = signaturePadState.ctx || canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
window.addEventListener('load',initSignature);
</script>
</body>
</html>

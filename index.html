<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prüfbericht Feuerlöscher</title>
  <meta name="app-version" content="19" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#d6001c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Feuerlöscher" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="../../icons/icon-192.png" />

  <style>
    :root{
      --brand:#d6001c;
      --brand-dark:#b00018;
      --primary:#007aff;
      --primary-dark:#0063cc;
      --bg:#f4f4f6;
      --card:#ffffff;
      --field:#f2f2f7;
      --text:#1c1c1e;
      --muted:#6e6e73;
      --line:#ffffff;
      --radius:16px;
      --shadow:0 8px 28px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box;}

    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
      margin:0;
      padding:18px;
      padding-left:max(18px, env(safe-area-inset-left));
      padding-right:max(18px, env(safe-area-inset-right));
      background:var(--bg);
      color:var(--text);
    }

    .container{
      width:min(100%, 1440px);
      margin:0 auto;
      background:var(--card);
      padding:20px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .title-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .title-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
      padding:12px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(60,60,67,.16);
      border-radius:var(--radius);
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      -webkit-backdrop-filter:blur(18px);
      backdrop-filter:blur(18px);
    }

    h1{
      font-size:clamp(24px, 3.2vw, 36px);
      line-height:1.1;
      margin:0;
      letter-spacing:-.02em;
    }

    .header-left{
      width:100%;
    }

    .header-row{
      display:grid;
      grid-template-columns:repeat(3, minmax(180px, 1fr));
      gap:12px;
      margin-bottom:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    label{
      font-size:15px;
      font-weight:700;
      margin:0 0 6px;
      color:var(--muted);
    }

    input[type="text"],
    input[type="date"],
    textarea,
    select{
      width:100%;
      min-height:44px;
      border:0;
      border-radius:12px;
      background:var(--field);
      color:var(--text);
      font-size:17px;
      font-weight:650;
      padding:10px 12px;
      outline:none;
      -webkit-tap-highlight-color:transparent;
    }

    input:focus,
    textarea:focus,
    select:focus{
      box-shadow:0 0 0 3px rgba(214,0,28,.18);
    }

    select{
      appearance:auto;
      font-size:15px;
      padding:8px 10px;
    }

    .table-wrapper{
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      border-radius:14px;
      background:#fff;
    }

    table{
      width:100%;
      min-width:1320px;
      border-collapse:separate;
      border-spacing:0;
      margin-top:16px;
      table-layout:fixed;
    }

    th, td{
      border:2px solid var(--line);
      background:#f5f5f5;
      padding:8px;
      text-align:center;
      vertical-align:middle;
    }

    th{
      background:var(--brand);
      color:#fff;
      font-size:13px;
      line-height:1.15;
      font-weight:800;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:normal;
      hyphens:auto;
      overflow:hidden;
    }

    #reportTable col.col-pos{width:58px;}
    #reportTable col.col-standort{width:260px;}
    #reportTable col.col-typ{width:90px;}
    #reportTable col.col-hersteller{width:110px;}
    #reportTable col.col-baujahr{width:85px;}
    #reportTable col.col-status{width:118px;}
    #reportTable col.col-kurz{width:94px;}
    #reportTable col.col-loeschmittel{width:120px;}

    td input[type="text"]{
      width:100%;
      font-size:14px;
      min-height:40px;
      padding:8px;
    }

    .col-pos{width:58px;}
    .col-standort{width:260px;}
    .col-typ{width:90px;}
    .col-hersteller{width:110px;}
    .col-baujahr{width:85px;}
    .col-status{width:118px;}
    .col-kurz{width:94px;}
    .col-loeschmittel{width:120px;}

    .pos-field{
      text-align:center;
      font-weight:800;
    }

    .standort-field{
      min-width:0;
      text-align:left;
    }

    .type-field,
    .hersteller-field,
    .baujahr-field,
    .loeschmittel-field{
      text-align:center;
    }

    .checkbox-center{
      text-align:center;
    }

    input[type="checkbox"]{
      -webkit-appearance:checkbox !important;
      appearance:checkbox !important;
      width:28px;
      height:28px;
      cursor:pointer;
      accent-color:var(--brand);
    }

    .actions,
    .signature-actions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      min-height:46px;
      padding:12px 18px;
      border:none;
      border-radius:999px;
      cursor:pointer;
      font-size:15px;
      font-weight:700;
      letter-spacing:-0.01em;
      color:#ffffff;
      background:var(--primary);
      box-shadow:0 8px 18px rgba(0,122,255,0.22);
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }

    button:hover{filter:brightness(0.96);}
    button:active{transform:scale(.98);}
    button:disabled{
      opacity:.55;
      cursor:default;
      transform:none;
    }

    button.secondary{
      background:#8e8e93;
      color:#ffffff;
      box-shadow:0 8px 18px rgba(142,142,147,0.22);
    }

    button.danger{
      background:#ff3b30;
      color:#ffffff;
      box-shadow:0 8px 18px rgba(255,59,48,0.22);
    }

    button.success{
      background:#34c759;
      color:#ffffff;
      box-shadow:0 8px 18px rgba(52,199,89,0.22);
    }

    button.archive-save{
      background:#ff9500;
      color:#ffffff;
      box-shadow:0 8px 18px rgba(255,149,0,0.22);
    }

    button.archive-open{
      background:#0a84ff;
      color:#ffffff;
      box-shadow:0 8px 18px rgba(10,132,255,0.22);
    }

    button.secondary:hover,
    button.danger:hover,
    button.success:hover{
      filter:brightness(0.96);
    }

    .signature-block{
      margin-top:28px;
    }

    .signature-block h3{
      margin:0 0 10px;
      font-size:20px;
    }

    #signaturePad{
      border:1.5px solid #d1d1d6;
      border-radius:14px;
      width:100%;
      max-width:620px;
      height:180px;
      touch-action:none;
      background:#fff;
      display:block;
    }

    .hint{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
    }

    .archive-status{
      min-height:18px;
      margin:12px 0 0;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      line-height:1.3;
    }

    .archive-overlay[hidden]{
      display:none;
    }

    .archive-overlay{
      position:fixed;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(28,28,30,.34);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
    }

    .archive-dialog{
      width:min(100%, 720px);
      max-height:min(680px, 92vh);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#ffffff;
      border:1px solid rgba(60,60,67,.16);
      border-radius:var(--radius);
      box-shadow:0 18px 50px rgba(0,0,0,.18);
    }

    .archive-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid rgba(60,60,67,.12);
    }

    .archive-header h2{
      margin:0;
      font-size:22px;
      line-height:1.15;
      font-weight:800;
    }

    .archive-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:12px;
      overflow:auto;
    }

    .archive-empty{
      margin:0;
      padding:24px 12px;
      color:var(--muted);
      text-align:center;
      font-weight:700;
    }

    .archive-item{
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:8px;
      align-items:center;
      padding:12px;
      background:#f7f7fb;
      border:1px solid rgba(60,60,67,.12);
      border-radius:14px;
    }

    .archive-title{
      min-width:0;
      font-weight:800;
      line-height:1.25;
      overflow-wrap:anywhere;
    }

    .archive-meta{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      line-height:1.25;
    }

    .archive-item button,
    .archive-close-btn{
      min-height:38px;
      padding:8px 13px;
      font-size:13px;
      box-shadow:none;
    }

    @media (max-width: 900px){
      body{padding:12px;}
      .container{padding:14px;border-radius:14px;}
      .title-bar{align-items:stretch;flex-direction:column;}
      .title-actions{justify-content:stretch;}
      .header-row{grid-template-columns:1fr 1fr;gap:10px;}
      .field.full-mobile{grid-column:1 / -1;}
      table{min-width:1180px;}
      th{font-size:12px;}
      button{width:100%;}
      .actions,.signature-actions{display:grid;grid-template-columns:1fr 1fr;}
      .actions button:nth-child(3),.actions button:nth-child(4){grid-column:auto;}
      .archive-item{grid-template-columns:1fr;}
    }

    @media (max-width: 520px){
      .header-row{grid-template-columns:1fr;}
      .actions,.signature-actions{grid-template-columns:1fr;}
    }

    @page{
      size:A4 landscape;
      margin:8mm;
    }

    @media print{
      html, body{
        margin:0 !important;
        padding:0 !important;
        background:white !important;
      }

      *{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
        color-adjust:exact !important;
      }

      .actions,
      .title-actions,
      .signature-actions,
      .archive-status,
      .hint{
        display:none !important;
      }

      .container{
        width:100%;
        box-shadow:none;
        border-radius:0;
        padding:0;
      }

      .table-wrapper{
        overflow:visible;
        border-radius:0;
      }

      table{
        min-width:0;
        width:100%;
        border-collapse:collapse;
        table-layout:fixed;
      }

      th,td{
        border:1px solid #fff !important;
        border-radius:0 !important;
        padding:4px !important;
        font-size:9px !important;
        line-height:1.15 !important;
      }

      th{
        background:#d9d9de !important;
        color:#000 !important;
      }

      td{
        background:#f2f2f7 !important;
      }

      input,select{
        min-height:0 !important;
        padding:0 !important;
        border-radius:0 !important;
        background:transparent !important;
        box-shadow:none !important;
        font-size:9px !important;
      }
    }
  

    /* FSMobile iOS UI refresh */
    :root {
      --ios-blue: #007aff;
      --ios-blue-pressed: #005ecb;
      --ios-red: #ff3b30;
      --ios-red-pressed: #d70015;
      --ios-green: #34c759;
      --ios-green-pressed: #248a3d;
      --ios-neutral: #8e8e93;
      --ios-neutral-pressed: #6e6e73;
      --ios-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    h1 {
      font-size: 34px !important;
      letter-spacing: 0 !important;
    }

    h2,
    h3,
    label,
    .subtitle,
    .module-card h2,
    .archive-title,
    .archive-meta {
      letter-spacing: 0 !important;
    }

    button,
    .button,
    a.button,
    .btn-primary,
    .btn-archive,
    .btn-archive-save {
      border-radius: 13px !important;
      color: #ffffff;
      background: linear-gradient(180deg, #1688ff 0%, var(--ios-blue) 100%) !important;
      box-shadow: 0 10px 20px rgba(0, 122, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.32) !important;
      transition: transform 0.18s var(--ios-ease), box-shadow 0.18s var(--ios-ease), background 0.18s var(--ios-ease), filter 0.18s var(--ios-ease) !important;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover,
    .button:hover,
    a.button:hover,
    .btn-primary:hover,
    .btn-archive:hover,
    .btn-archive-save:hover {
      filter: brightness(1.02) !important;
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.34) !important;
    }

    button:active,
    .button:active,
    a.button:active,
    .btn-primary:active,
    .btn-archive:active,
    .btn-archive-save:active {
      transform: scale(0.975) !important;
      background: linear-gradient(180deg, var(--ios-blue) 0%, var(--ios-blue-pressed) 100%) !important;
      box-shadow: 0 5px 12px rgba(0, 122, 255, 0.22), inset 0 1px 2px rgba(0, 0, 0, 0.12) !important;
    }

    button:focus-visible,
    .button:focus-visible,
    a.button:focus-visible {
      outline: 3px solid rgba(0, 122, 255, 0.28) !important;
      outline-offset: 3px !important;
    }

    button:disabled,
    .button:disabled {
      opacity: 0.55 !important;
      cursor: default !important;
      transform: none !important;
    }

    .clear-btn,
    .btn-secondary,
    button.secondary,
    button[data-action="secondary"] {
      background: linear-gradient(180deg, #a6a6ad 0%, var(--ios-neutral) 100%) !important;
      box-shadow: 0 10px 20px rgba(142, 142, 147, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
    }

    .clear-btn:active,
    .btn-secondary:active,
    button.secondary:active,
    button[data-action="secondary"]:active {
      background: linear-gradient(180deg, var(--ios-neutral) 0%, var(--ios-neutral-pressed) 100%) !important;
    }

    .danger,
    .btn-danger,
    button.danger,
    button[data-action="danger"] {
      background: linear-gradient(180deg, #ff453a 0%, var(--ios-red) 100%) !important;
      box-shadow: 0 10px 20px rgba(255, 59, 48, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
    }

    .danger:active,
    .btn-danger:active,
    button.danger:active,
    button[data-action="danger"]:active {
      background: linear-gradient(180deg, var(--ios-red) 0%, var(--ios-red-pressed) 100%) !important;
    }

    .btn-archive-save,
    button.success,
    button[data-action="success"] {
      background: linear-gradient(180deg, #40d96a 0%, var(--ios-green) 100%) !important;
      box-shadow: 0 10px 20px rgba(52, 199, 89, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
    }

    .section,
    .card,
    .container,
    .module-card,
    .report-table,
    .archive-list,
    .info-grid,
    .button-area,
    .title-actions,
    .toolbar {
      transition: transform 0.22s var(--ios-ease), box-shadow 0.22s var(--ios-ease), border-color 0.22s var(--ios-ease), background 0.22s var(--ios-ease);
    }

    @media (max-width: 560px) {
      h1 { font-size: 32px !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* Einheitliche Aktionsfarben */
    button,
    .button,
    a.button,
    .pdf-btn,
    .btn-primary {
      background: #007aff !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(0, 122, 255, 0.22) !important;
    }

    button.archive-save,
    button.archive-save-btn,
    button.btn-archive-save {
      background: #ff9500 !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(255, 149, 0, 0.24) !important;
    }

    button.archive-open,
    button.archive-open-btn,
    button.archive-btn,
    button.btn-archive,
    button.pdf-btn,
    button#pdfButton,
    button#pdfBtn {
      background: #007aff !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(0, 122, 255, 0.22) !important;
    }

    button.duplicate-btn {
      background: #5856d6 !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(88, 86, 214, 0.24) !important;
    }

    button.success,
    button.add-btn,
    button.btn-success,
    button[data-action="success"],
    button#addCo2PatroneBtn,
    button#addDruckgaserzeugerBtn,
    button#addOeffnungselementBtn {
      background: #34c759 !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(52, 199, 89, 0.24) !important;
    }

    button.danger,
    button.remove-btn,
    button.archive-delete-btn,
    button.dynamic-remove,
    button.btn-danger,
    button[data-action="danger"] {
      background: #ff3b30 !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(255, 59, 48, 0.24) !important;
    }

    button.secondary,
    button.clear-btn,
    button.btn-secondary,
    button[data-action="secondary"] {
      background: #8e8e93 !important;
      color: #ffffff !important;
      box-shadow: 0 8px 18px rgba(142, 142, 147, 0.22) !important;
    }

    /* FSMobile unified button style */
    :root {
      --fsm-btn-blue: #007aff;
      --fsm-btn-blue-top: #1688ff;
      --fsm-btn-blue-pressed: #0062cc;
      --fsm-btn-orange: #ff9500;
      --fsm-btn-orange-top: #ffab32;
      --fsm-btn-orange-pressed: #c76f00;
      --fsm-btn-green: #34c759;
      --fsm-btn-green-top: #40d96a;
      --fsm-btn-green-pressed: #248a3d;
      --fsm-btn-red: #ff3b30;
      --fsm-btn-red-top: #ff453a;
      --fsm-btn-red-pressed: #d70015;
      --fsm-btn-gray: #8e8e93;
      --fsm-btn-gray-top: #a6a6ad;
      --fsm-btn-gray-pressed: #6e6e73;
      --fsm-btn-purple: #5856d6;
      --fsm-btn-purple-top: #6e6cff;
      --fsm-btn-purple-pressed: #4240aa;
      --fsm-btn-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    button,
    .button,
    a.button,
    input[type="button"],
    input[type="submit"],
    .btn-primary,
    .btn-archive,
    .btn-archive-save,
    .pdf-btn {
      min-height: 46px !important;
      padding: 12px 18px !important;
      border: none !important;
      border-radius: 999px !important;
      appearance: none !important;
      -webkit-appearance: none !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      cursor: pointer !important;
      color: #ffffff !important;
      background: linear-gradient(180deg, var(--fsm-btn-blue-top) 0%, var(--fsm-btn-blue) 100%) !important;
      box-shadow: 0 10px 20px rgba(0, 122, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.32) !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Arial, sans-serif !important;
      font-size: 15px !important;
      font-weight: 800 !important;
      line-height: 1.15 !important;
      letter-spacing: 0 !important;
      text-align: center !important;
      text-decoration: none !important;
      white-space: normal !important;
      -webkit-tap-highlight-color: transparent !important;
      transition: transform 0.18s var(--fsm-btn-ease), box-shadow 0.18s var(--fsm-btn-ease), background 0.18s var(--fsm-btn-ease), filter 0.18s var(--fsm-btn-ease) !important;
    }

    button:hover,
    .button:hover,
    a.button:hover,
    input[type="button"]:hover,
    input[type="submit"]:hover,
    .btn-primary:hover,
    .btn-archive:hover,
    .btn-archive-save:hover,
    .pdf-btn:hover {
      filter: brightness(1.02) !important;
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.34) !important;
    }

    button:active,
    .button:active,
    a.button:active,
    input[type="button"]:active,
    input[type="submit"]:active,
    .btn-primary:active,
    .btn-archive:active,
    .btn-archive-save:active,
    .pdf-btn:active {
      transform: scale(0.975) !important;
      background: linear-gradient(180deg, var(--fsm-btn-blue) 0%, var(--fsm-btn-blue-pressed) 100%) !important;
      box-shadow: 0 5px 12px rgba(0, 122, 255, 0.22), inset 0 1px 2px rgba(0, 0, 0, 0.12) !important;
    }

    button:focus-visible,
    .button:focus-visible,
    a.button:focus-visible,
    input[type="button"]:focus-visible,
    input[type="submit"]:focus-visible {
      outline: 3px solid rgba(0, 122, 255, 0.28) !important;
      outline-offset: 3px !important;
    }

    button:disabled,
    .button:disabled,
    input[type="button"]:disabled,
    input[type="submit"]:disabled {
      opacity: 0.55 !important;

      box-shadow: 0 5px 12px rgba(142, 142, 147, 0.20), inset 0 1px 2px rgba(0, 0, 0, 0.12) !important;
    }

      background: linear-gradient(180deg, var(--fsm-btn-purple-top) 0%, var(--fsm-btn-purple) 100%) !important;
      box-shadow: 0 10px 20px rgba(88, 86, 214, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.32) !important;

      background: linear-gradient(180deg, var(--fsm-btn-purple) 0%, var(--fsm-btn-purple-pressed) 100%) !important;
      box-shadow: 0 5px 12px rgba(88, 86, 214, 0.22), inset 0 1px 2px rgba(0, 0, 0, 0.12) !important;

    body {

    .container {

      margin: 0 !important;

    /* FSMobile iframe header action safe area */
    .title-bar > .title-actions,

      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      -webkit-backdrop-filter: none !important;

    body.generating-pdf .title-bar > .title-actions,
    body.generating-pdf header > .title-actions,

<body>
  <div class="container" id="reportRoot">
    <div class="title-bar">
      <h1>Prüfbericht Feuerlöscher</h1>
      <div class="title-actions" aria-label="Archivaktionen">
        <button type="button" onclick="saveCurrentReportToArchive()" class="archive-save">Im Archiv speichern</button>
        <button type="button" onclick="openArchive()" class="archive-open">Archiv</button>
      </div>
    </div>

    <div class="header-left">
      <div class="header-row">
        <div class="field">
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" placeholder="Name eingeben" autocomplete="off" />
        </div>

        <div class="field">
          <label for="objectInput">Objekt</label>
          <input id="objectInput" type="text" placeholder="Objekt eingeben" autocomplete="off" />
        </div>

        <div class="field full-mobile">
          <label for="dateInput">Datum</label>
          <input id="dateInput" type="date" />
        </div>
      </div>
    </div>

    <div class="table-wrapper">
      <table id="reportTable" aria-label="Prüfbericht Feuerlöscher Tabelle">
        <colgroup>
          <col class="col-pos">
          <col class="col-standort">
          <col class="col-typ">
          <col class="col-hersteller">
          <col class="col-baujahr">
          <col class="col-status">
          <col class="col-status">
          <col class="col-status">
          <col class="col-status">
          <col class="col-kurz">
          <col class="col-status">
          <col class="col-loeschmittel">
          <col class="col-kurz">
        </colgroup>
        <thead>
          <tr>
            <th class="col-pos">Pos.</th>
            <th class="col-standort">Standort</th>
            <th class="col-typ">Typ</th>
            <th class="col-hersteller">Hersteller</th>
            <th class="col-baujahr">Baujahr</th>
            <th class="col-status">Außeninspektion</th>
            <th class="col-status">Innenkontrolle</th>
            <th class="col-status">BetrSichV<br>Kategorie I-II</th>
            <th class="col-status">Schlauchprüfung</th>
            <th class="col-kurz">Reinigung</th>
            <th class="col-status">Druck-/Dichtheit</th>
            <th class="col-loeschmittel">Löschmittel<br>Tausch bis</th>
            <th class="col-kurz">Prüfplakette</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button type="button" onclick="addRow()" class="success">Neue Zeile</button>
      <button type="button" onclick="duplicateLastRow()" class="duplicate-btn">Duplizieren</button>
      <button type="button" onclick="removeRow()" class="danger">Letzte Zeile löschen</button>
      <button type="button" onclick="clearForm()" class="secondary">Leeren</button>
      <button type="button" class="pdf-btn" onclick="exportPdf()">PDF</button>
    </div>

    <div class="signature-block">
      <h3>Digitale Unterschrift</h3>
      <canvas id="signaturePad" aria-label="Digitale Unterschrift"></canvas>
      <div class="signature-actions">
        <button type="button" onclick="clearSignature()" class="danger">Unterschrift löschen</button>
      </div>
      <div class="hint">Tipp: Auf dem iPad mit Finger oder Apple Pencil unterschreiben.</div>
    </div>
    <p class="archive-status" id="archiveStatus" role="status" aria-live="polite"></p>
  </div>

  <div class="archive-overlay" id="archiveOverlay" hidden>
    <div class="archive-dialog" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
      <div class="archive-header">
        <h2 id="archiveTitle">Archiv</h2>
        <button type="button" onclick="closeArchive()" class="secondary archive-close-btn" aria-label="Archiv schließen">Schließen</button>
      </div>
      <div class="archive-list" id="archiveList" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const PDF_HEADERS = [
      'Pos.', 'Standort', 'Typ', 'Hersteller', 'Baujahr', 'Außeninspektion', 'Innenkontrolle',
      'BetrSichV\nKategorie I-II', 'Schlauchprüfung', 'Reinigung', 'Druck-/Dichtheit',
      'Löschmittel\nTausch bis', 'Prüfplakette'
    ];


    const STORAGE_KEY = 'pb-feuerloescher-report-v1';
    const ARCHIVE_STORAGE_KEY = 'pb-feuerloescher-report-archive-v1';
    const CURRENT_ARCHIVE_ID_KEY = 'pb-feuerloescher-current-archive-id';
    let storageRestoreInProgress = false;
    let storageSaveTimer = null;
    let archiveStatusTimer = null;

    function createSelect(options){
      const select = document.createElement('select');
      options.forEach(optionText => {
        const option = document.createElement('option');
        option.value = optionText;
        option.text = optionText;
        select.add(option);
      });
      return select;
    }

    function updatePositionNumbers(){
      document.querySelectorAll('#tableBody tr').forEach((row, index) => {
        const pos = row.querySelector('.pos-field');
        if(pos) pos.value = index + 1;
      });
    }

    function addRow(){
      const tableBody = document.getElementById('tableBody');
      const row = document.createElement('tr');

      row.innerHTML = `
        <td><input type="text" class="pos-field" readonly aria-label="Position"></td>
        <td><input type="text" class="standort-field" placeholder="Standort eingeben" autocomplete="off" aria-label="Standort"></td>
        <td><input type="text" class="type-field" autocomplete="off" aria-label="Typ"></td>
        <td><input type="text" class="hersteller-field" autocomplete="off" aria-label="Hersteller"></td>
        <td><input type="text" class="baujahr-field" inputmode="numeric" autocomplete="off" aria-label="Baujahr"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="checkbox-center"><input type="checkbox" aria-label="Reinigung"></td>
        <td></td>
        <td><input type="text" class="loeschmittel-field" autocomplete="off" aria-label="Löschmittel Tausch bis"></td>
        <td class="checkbox-center"><input type="checkbox" aria-label="Prüfplakette"></td>
      `;

      row.cells[5].appendChild(createSelect(['I.O', 'n.i.O']));
      row.cells[6].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));
      row.cells[7].appendChild(createSelect(['I.O', 'n.i.O']));
      row.cells[8].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));
      row.cells[10].appendChild(createSelect(['I.O', 'n.i.O', 'n.n']));

      tableBody.appendChild(row);
      updatePositionNumbers();
      scheduleStorageSave();
    }

    function removeRow(){
      const tableBody = document.getElementById('tableBody');
      if(tableBody.rows.length > 1){
        tableBody.deleteRow(tableBody.rows.length - 1);
      }
      updatePositionNumbers();
      scheduleStorageSave();
    }

    function duplicateLastRow(){
      const tableBody = document.getElementById('tableBody');
      const lastRow = tableBody.rows[tableBody.rows.length - 1];
      if(!lastRow) return;

      const values = Array.from(lastRow.cells).map(getCellValue);
      addRow();
      const newRow = tableBody.rows[tableBody.rows.length - 1];
      Array.from(newRow.cells).forEach((cell, index) => setCellValue(cell, values[index]));
      updatePositionNumbers();
      scheduleStorageSave();
    }

    function clearForm(){
      const shouldClear = confirm('Alle Eingaben wirklich löschen?');
      if(!shouldClear) return;

      document.querySelectorAll('input[type="text"], input[type="date"], textarea').forEach(input => {
        input.value = '';
      });
      document.querySelectorAll('select').forEach(select => {
        select.selectedIndex = 0;
      });
      document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = false;
      });

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      addRow();
      clearSignature(true);
      try{ localStorage.removeItem(STORAGE_KEY); }catch(error){}
      clearCurrentArchiveId();
      setArchiveStatus('Aktueller Prüfbericht wurde geleert. Archivierte Prüfberichte bleiben erhalten.');
    }

    function getCellValue(cell){
      const checkbox = cell.querySelector('input[type="checkbox"]');
      if(checkbox) return checkbox.checked ? 'Ja' : '';

      const select = cell.querySelector('select');
      if(select) return select.options[select.selectedIndex]?.text || select.value || '';

      const input = cell.querySelector('input, textarea');
      if(input) return String(input.value || '').trim();

      return String(cell.textContent || '').trim();
    }

    function getTableData(){
      return Array.from(document.querySelectorAll('#tableBody tr')).map(row => {
        return Array.from(row.cells).map(getCellValue);
      });
    }


    function getCellInput(cell){
      return cell.querySelector('input[type="checkbox"], select, input, textarea');
    }

    function setCellValue(cell, value){
      const field = getCellInput(cell);
      if(!field) return;

      if(field.type === 'checkbox'){
        field.checked = value === true || value === 'true' || value === 'Ja';
        return;
      }

      if(field.tagName === 'SELECT'){
        const valueText = String(value || '');
        const optionIndex = Array.from(field.options).findIndex(option => option.value === valueText || option.text === valueText);
        field.selectedIndex = optionIndex >= 0 ? optionIndex : 0;
        return;
      }

      field.value = value == null ? '' : String(value);
    }

    function getStorageSignature(){
      const canvas = document.getElementById('signaturePad');
      if(!canvas || isCanvasBlank(canvas)) return '';
      try{ return canvas.toDataURL('image/png'); }catch(error){ return ''; }
    }

    function buildStoragePayload(){
      return {
        name: document.getElementById('nameInput')?.value || '',
        object: document.getElementById('objectInput')?.value || '',
        date: document.getElementById('dateInput')?.value || '',
        rows: getTableData(),
        signature: getStorageSignature(),
        savedAt: new Date().toISOString()
      };
    }

    function saveToStorageNow(){
      if(storageRestoreInProgress) return;
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(buildStoragePayload()));
      }catch(error){
        console.warn('Eingaben konnten nicht lokal gespeichert werden:', error);
      }
    }

    function scheduleStorageSave(){
      if(storageRestoreInProgress) return;
      window.clearTimeout(storageSaveTimer);
      storageSaveTimer = window.setTimeout(saveToStorageNow, 180);
    }

    function restoreSignatureFromStorage(signatureData){
      if(!signatureData || !signaturePadState.ctx || !signaturePadState.canvas) return;

      const canvas = signaturePadState.canvas;
      const ctx = signaturePadState.ctx;
      const rect = canvas.getBoundingClientRect();
      const image = new Image();
      image.onload = () => {
        ctx.drawImage(image, 0, 0, rect.width, rect.height);
      };
      image.src = signatureData;
    }

    function applyStoragePayload(saved){
      storageRestoreInProgress = true;

      document.getElementById('nameInput').value = saved?.name || '';
      document.getElementById('objectInput').value = saved?.object || '';
      document.getElementById('dateInput').value = saved?.date || '';

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      const rows = Array.isArray(saved?.rows) && saved.rows.length ? saved.rows : [[]];
      rows.forEach(rowValues => {
        addRow();
        const row = tableBody.rows[tableBody.rows.length - 1];
        const migratedRowValues = migrateRowValues(rowValues);
        Array.from(row.cells).forEach((cell, index) => {
          setCellValue(cell, migratedRowValues[index]);
        });
      });
      updatePositionNumbers();

      storageRestoreInProgress = false;
      if(saved?.signature){
        window.setTimeout(() => restoreSignatureFromStorage(saved.signature), 80);
      }
    }

    function restoreFromStorage(){
      let saved = null;
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        saved = raw ? JSON.parse(raw) : null;
      }catch(error){
        console.warn('Gespeicherte Eingaben konnten nicht geladen werden:', error);
      }

      applyStoragePayload(saved);
    }

    function migrateRowValues(rowValues){
      const values = Array.isArray(rowValues) ? rowValues.slice() : [];
      if(values.length === 12){
        values.splice(3, 0, '');
      }
      return values;
    }

    function readStoredValue(key){
      try{ return localStorage.getItem(key); }
      catch(error){
        console.warn('Lokaler Speicher konnte nicht gelesen werden:', error);
        return null;
      }
    }

    function writeStoredValue(key, value){
      try{
        localStorage.setItem(key, value);
        return true;
      }catch(error){
        console.warn('Lokaler Speicher konnte nicht beschrieben werden:', error);
        return false;
      }
    }

    function removeStoredValue(key){
      try{ localStorage.removeItem(key); }
      catch(error){
        console.warn('Lokaler Speicher konnte nicht geleert werden:', error);
      }
    }

    function createArchiveId(){
      if(window.crypto && window.crypto.randomUUID){
        return window.crypto.randomUUID();
      }
      return `archive-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function getCurrentArchiveId(){
      return readStoredValue(CURRENT_ARCHIVE_ID_KEY);
    }

    function setCurrentArchiveId(id){
      if(id){
        writeStoredValue(CURRENT_ARCHIVE_ID_KEY, id);
      }else{
        clearCurrentArchiveId();
      }
    }

    function clearCurrentArchiveId(){
      removeStoredValue(CURRENT_ARCHIVE_ID_KEY);
    }

    function loadArchiveEntries(){
      try{
        const entries = JSON.parse(readStoredValue(ARCHIVE_STORAGE_KEY) || '[]');
        return Array.isArray(entries) ? entries : [];
      }catch(error){
        console.warn('Archiv konnte nicht gelesen werden:', error);
        return [];
      }
    }

    function writeArchiveEntries(entries){
      return writeStoredValue(ARCHIVE_STORAGE_KEY, JSON.stringify(entries));
    }

    function getDisplayDate(value){
      return value ? formatDateForFile(value) : 'Ohne Datum';
    }

    function getArchiveTitle(entry){
      const report = entry && entry.report ? entry.report : {};
      const name = String(report.name || '').trim() || 'Ohne Name';
      const object = String(report.object || '').trim() || 'Ohne Objekt';
      return `${name} - ${object} - ${getDisplayDate(report.date)}`;
    }

    function saveCurrentReportToArchive(){
      saveToStorageNow();

      const now = new Date().toISOString();
      const currentId = getCurrentArchiveId();
      const entries = loadArchiveEntries();
      const existingIndex = currentId ? entries.findIndex(entry => entry.id === currentId) : -1;
      const entry = {
        id: existingIndex >= 0 ? entries[existingIndex].id : createArchiveId(),
        createdAt: existingIndex >= 0 ? entries[existingIndex].createdAt : now,
        updatedAt: now,
        report: buildStoragePayload()
      };

      if(existingIndex >= 0){
        entries[existingIndex] = entry;
      }else{
        entries.push(entry);
      }

      if(writeArchiveEntries(entries)){
        setCurrentArchiveId(entry.id);
        renderArchiveList();
        setArchiveStatus('Prüfbericht wurde im Archiv gespeichert.');
      }else{
        setArchiveStatus('Prüfbericht konnte nicht im Archiv gespeichert werden.');
      }
    }

    function openArchiveEntry(id){
      const entry = loadArchiveEntries().find(item => item.id === id);
      if(!entry) return;

      clearSignature(true);
      applyStoragePayload(entry.report);
      setCurrentArchiveId(entry.id);
      saveToStorageNow();
      closeArchive();
      setArchiveStatus('Prüfbericht aus dem Archiv geöffnet.');
    }

    function deleteArchiveEntry(id){
      const entries = loadArchiveEntries();
      const entry = entries.find(item => item.id === id);
      if(!entry) return;

      if(!confirm(`Archiv-Eintrag "${getArchiveTitle(entry)}" löschen?`)) return;

      writeArchiveEntries(entries.filter(item => item.id !== id));
      if(getCurrentArchiveId() === id){
        clearCurrentArchiveId();
      }
      renderArchiveList();
      setArchiveStatus('Archiv-Eintrag wurde gelöscht.');
    }

    function renderArchiveList(){
      const archiveList = document.getElementById('archiveList');
      const entries = loadArchiveEntries()
        .slice()
        .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));

      archiveList.innerHTML = '';

      if(!entries.length){
        const empty = document.createElement('p');
        empty.className = 'archive-empty';
        empty.textContent = 'Noch keine gespeicherten Prüfberichte im Archiv.';
        archiveList.appendChild(empty);
        return;
      }

      entries.forEach(entry => {
        const item = document.createElement('article');
        item.className = 'archive-item';

        const text = document.createElement('div');
        const title = document.createElement('div');
        const meta = document.createElement('div');
        title.className = 'archive-title';
        meta.className = 'archive-meta';
        title.textContent = getArchiveTitle(entry);
        meta.textContent = `Geändert: ${getDisplayDate((entry.updatedAt || '').slice(0, 10))}`;

        text.appendChild(title);
        text.appendChild(meta);

        const openButton = document.createElement('button');
        openButton.type = 'button';
        openButton.className = 'archive-open';
        openButton.textContent = 'Öffnen';
        openButton.addEventListener('click', () => openArchiveEntry(entry.id));

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'danger';
        deleteButton.textContent = 'Löschen';
        deleteButton.addEventListener('click', () => deleteArchiveEntry(entry.id));

        item.appendChild(text);
        item.appendChild(openButton);
        item.appendChild(deleteButton);
        archiveList.appendChild(item);
      });
    }

    function openArchive(){
      renderArchiveList();
      document.getElementById('archiveOverlay').hidden = false;
    }

    function closeArchive(){
      document.getElementById('archiveOverlay').hidden = true;
    }

    function setArchiveStatus(message){
      const status = document.getElementById('archiveStatus');
      if(!status) return;

      status.textContent = message || '';
      window.clearTimeout(archiveStatusTimer);

      if(message){
        archiveStatusTimer = window.setTimeout(() => {
          status.textContent = '';
        }, 4000);
      }
    }

    function formatDateForFile(dateValue){
      if(!dateValue) return new Date().toLocaleDateString('de-DE').replaceAll('.', '-');
      const [year, month, day] = dateValue.split('-');
      return `${day}.${month}.${year}`;
    }

    function sanitizeFileName(value){
      return (value || 'Pruefbericht-Feuerloescher')
        .trim()
        .replace(/[\\/:*?"<>|]+/g, '-')
        .replace(/\s+/g, '_')
        .slice(0, 80) || 'Pruefbericht-Feuerloescher';
    }

    function getPdfFileName(){
      const objectName = sanitizeFileName(document.getElementById('objectInput').value);
      const dateName = formatDateForFile(document.getElementById('dateInput').value);
      return `${objectName}_${dateName}.pdf`;
    }

    function ensureJsPdf(){
      if(window.jspdf && typeof window.jspdf.jsPDF === 'function') return window.jspdf.jsPDF;
      if(typeof window.jsPDF === 'function') return window.jsPDF;
      return null;
    }

    async function loadJsPdfIfNeeded(){
      const existing = ensureJsPdf();
      if(existing) return existing;

      return new Promise(resolve => {
        const script = document.createElement('script');
        script.src = '../../vendor/jspdf.umd.min.js';
        script.onload = () => resolve(ensureJsPdf());
        script.onerror = () => resolve(null);
        document.head.appendChild(script);
      });
    }

    function savePdfDocument(doc, fileName){
      try{
        doc.save(fileName);
      }catch(error){
        try{
          const blob = doc.output('blob');
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }catch(secondError){
          alert('PDF konnte nicht gespeichert werden. Bitte im Browser erneut öffnen und noch einmal versuchen.');
        }
      }
    }

    function normalizePdfText(value){
      return String(value || '')
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/\u2713/g, 'Ja')
        .trim();
    }

    async function exportPdf(){
      if(document.activeElement && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }

      const pdfButton = Array.from(document.querySelectorAll('button')).find(button => button.textContent.trim() === 'PDF');
      const originalButtonText = pdfButton ? pdfButton.textContent : '';
      if(pdfButton){
        pdfButton.disabled = true;
        pdfButton.textContent = 'PDF wird erstellt…';
      }

      try{
        const JsPDF = await loadJsPdfIfNeeded();
        if(!JsPDF){
          alert('PDF-Bibliothek konnte nicht geladen werden. Bitte Seite neu laden und erneut versuchen.');
          return;
        }

        const doc = new JsPDF({ orientation:'landscape', unit:'mm', format:'a4', compress:true });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 7;
        const usableWidth = pageWidth - margin * 2;
        const objectName = normalizePdfText(document.getElementById('objectInput').value);
        const dateValue = document.getElementById('dateInput').value || '';
        const nameValue = normalizePdfText(document.getElementById('nameInput').value);
        const dateText = dateValue ? formatDateForFile(dateValue) : '';
        const fileName = getPdfFileName();
        const rowData = getTableData();

        // Breiten sind bewusst auf Lesbarkeit und sichtbare Eingaben optimiert.
        // Die Summe wird anschließend exakt auf die A4-Querformat-Seite skaliert.
        const baseWidths = [10, 48, 18, 24, 17, 23, 23, 25, 23, 18, 23, 25, 20];
        const totalBaseWidth = baseWidths.reduce((sum, width) => sum + width, 0);
        const widths = baseWidths.map(width => width * usableWidth / totalBaseWidth);
        const tableX = margin;
        const headerHeight = 12;
        const lineHeight = 3.25;
        const minRowHeight = 9.5;
        const maxRowHeight = 31;
        const footerReserve = 34;
        const tableStartY = 25;

        function drawMetaField(label, value, x, y, maxValueWidth){
          doc.setTextColor(18, 18, 18);
          doc.setFont('helvetica', 'bold');
          doc.text(label, x, y);

          doc.setFont('helvetica', 'normal');
          const labelWidth = doc.getTextWidth(label + ' ');
          const safeValue = normalizePdfText(value || '-');
          const lines = doc.splitTextToSize(safeValue, maxValueWidth);
          doc.text(lines.slice(0, 1), x + labelWidth, y);
        }

        function drawPageHeader(){
          doc.setTextColor(18, 18, 18);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(14);
          doc.text('Prüfbericht Feuerlöscher', margin, 11);

          doc.setFontSize(8.6);
          drawMetaField('Name:', nameValue || '-', margin, 18, 37);
          drawMetaField('Objekt:', objectName || '-', margin + 92, 18, 42);
          drawMetaField('Datum:', dateText || '-', margin + 192, 18, 40);
        }

        function drawCellBackground(x, y, width, height, fillColor){
          // Hex-Farben plus getrenntes Füllen/Zeichnen verhindern schwarze Tabellenfelder in Safari/iPad und einzelnen PDF-Viewern.
          doc.setFillColor(fillColor);
          doc.rect(x, y, width, height, 'F');
          doc.setDrawColor('#ffffff');
          doc.setLineWidth(0.45);
          doc.rect(x, y, width, height, 'S');
        }

        function drawTableHeader(y){
          let x = tableX;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(6.5);

          PDF_HEADERS.forEach((header, index) => {
            drawCellBackground(x, y, widths[index], headerHeight, '#d6001c');
            doc.setTextColor('#ffffff');
            const manualLines = String(header).split('\n');
            const lines = manualLines.flatMap(line => doc.splitTextToSize(line, Math.max(3, widths[index] - 2.2))).slice(0, 3);
            const totalTextHeight = (lines.length - 1) * 3.0;
            const firstLineY = y + (headerHeight - totalTextHeight) / 2 + 2.2;
            lines.forEach((line, lineIndex) => {
              doc.setTextColor('#ffffff');
              doc.text(String(line), x + widths[index] / 2, firstLineY + lineIndex * 3.0, {align:'center'});
            });
            x += widths[index];
          });
          return y + headerHeight;
        }

        function getWrappedLines(text, columnIndex){
          const value = normalizePdfText(text);
          const innerWidth = Math.max(3, widths[columnIndex] - 2.2);
          if(!value) return [''];
          return doc.splitTextToSize(value, innerWidth);
        }

        function calculateRowHeight(row){
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.4);
          const maxLines = row.reduce((max, cell, index) => {
            return Math.max(max, getWrappedLines(cell, index).length);
          }, 1);
          return Math.min(maxRowHeight, Math.max(minRowHeight, 4.5 + maxLines * lineHeight));
        }

        function drawTableRow(row, y, rowHeight){
          let x = tableX;
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.4);

          row.forEach((cell, index) => {
            drawCellBackground(x, y, widths[index], rowHeight, '#f5f5f5');
            doc.setTextColor('#000000');
            const lines = getWrappedLines(cell, index);
            const maxVisibleLines = Math.max(1, Math.floor((rowHeight - 3) / lineHeight));
            const visibleLines = lines.slice(0, maxVisibleLines);
            if(lines.length > maxVisibleLines && visibleLines.length){
              const lastIndex = visibleLines.length - 1;
              visibleLines[lastIndex] = `${String(visibleLines[lastIndex]).replace(/\.{3}$/,'')}...`;
            }

            const align = index === 1 ? 'left' : 'center';
            const textX = align === 'left' ? x + 1.25 : x + widths[index] / 2;
            const textBlockHeight = (visibleLines.length - 1) * lineHeight;
            const startY = y + Math.max(4.6, (rowHeight - textBlockHeight) / 2 + 1.2);

            visibleLines.forEach((line, lineIndex) => {
              doc.setTextColor('#000000');
              doc.text(String(line), textX, startY + lineIndex * lineHeight, {align});
            });
            x += widths[index];
          });
        }

        function addNewTablePage(){
          doc.addPage('a4', 'landscape');
          drawPageHeader();
          return drawTableHeader(tableStartY);
        }

        drawPageHeader();
        let y = drawTableHeader(tableStartY);
        let bottomLimit = pageHeight - margin - footerReserve;

        rowData.forEach(row => {
          const rowHeight = calculateRowHeight(row);
          if(y + rowHeight > bottomLimit){
            y = addNewTablePage();
          }
          drawTableRow(row, y, rowHeight);
          y += rowHeight;
        });

        const signatureCanvas = document.getElementById('signaturePad');
        const signatureHasContent = signatureCanvas && !isCanvasBlank(signatureCanvas);
        if(y + footerReserve > pageHeight - margin){
          doc.addPage('a4', 'landscape');
          drawPageHeader();
          y = 29;
        }

        y += 7;

        if(signatureHasContent){
          try{
            const signatureData = signatureCanvas.toDataURL('image/png');
            doc.addImage(signatureData, 'PNG', margin, y, 55, 20, undefined, 'FAST');
          }catch(error){
            doc.setTextColor(0, 0, 0);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7);
            doc.text('Unterschrift konnte nicht eingebettet werden.', margin, y + 8);
          }
        }

        doc.setDrawColor(155, 155, 160);
        doc.setLineWidth(0.3);
        doc.line(margin, y + 24, margin + 70, y + 24);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7);
        doc.text('Unterschrift', margin, y + 28);

        savePdfDocument(doc, fileName);
      }catch(error){
        console.error('PDF-Export fehlgeschlagen:', error);
        alert('PDF konnte nicht erstellt werden. Bitte Seite neu laden und erneut versuchen.');
      }finally{
        if(pdfButton){
          pdfButton.disabled = false;
          pdfButton.textContent = originalButtonText;
        }
      }
    }

    let signaturePadState = {
      canvas:null,
      ctx:null,
      isDrawing:false,
      lastPoint:null
    };

    function setupSignatureCanvas(){
      const canvas = document.getElementById('signaturePad');
      if(!canvas) return;

      const oldData = signaturePadState.canvas && !isCanvasBlank(signaturePadState.canvas)
        ? signaturePadState.canvas.toDataURL('image/png')
        : null;

      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);

      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#222';

      signaturePadState.canvas = canvas;
      signaturePadState.ctx = ctx;

      if(oldData){
        const image = new Image();
        image.onload = () => ctx.drawImage(image, 0, 0, rect.width, rect.height);
        image.src = oldData;
      }
    }

    function getSignaturePoint(event){
      const canvas = signaturePadState.canvas;
      const rect = canvas.getBoundingClientRect();
      return {
        x:event.clientX - rect.left,
        y:event.clientY - rect.top
      };
    }

    function startSignature(event){
      event.preventDefault();
      const canvas = signaturePadState.canvas;
      if(!canvas || !signaturePadState.ctx) return;

      signaturePadState.isDrawing = true;
      signaturePadState.lastPoint = getSignaturePoint(event);

      if(canvas.setPointerCapture){
        canvas.setPointerCapture(event.pointerId);
      }
    }

    function drawSignature(event){
      if(!signaturePadState.isDrawing || !signaturePadState.ctx) return;
      event.preventDefault();

      const ctx = signaturePadState.ctx;
      const currentPoint = getSignaturePoint(event);
      const lastPoint = signaturePadState.lastPoint || currentPoint;

      ctx.beginPath();
      ctx.moveTo(lastPoint.x, lastPoint.y);
      ctx.lineTo(currentPoint.x, currentPoint.y);
      ctx.stroke();

      signaturePadState.lastPoint = currentPoint;
    }

    function stopSignature(event){
      if(!signaturePadState.isDrawing) return;
      signaturePadState.isDrawing = false;
      signaturePadState.lastPoint = null;

      const canvas = signaturePadState.canvas;
      if(canvas && canvas.releasePointerCapture && event && event.pointerId){
        try{ canvas.releasePointerCapture(event.pointerId); }catch(error){}
      }
      scheduleStorageSave();
    }

    function clearSignature(skipStorageSave = false){
      const canvas = signaturePadState.canvas || document.getElementById('signaturePad');
      if(!canvas) return;

      const ctx = signaturePadState.ctx || canvas.getContext('2d');
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      if(!skipStorageSave) scheduleStorageSave();
    }

    function isCanvasBlank(canvas){
      const context = canvas.getContext('2d');
      const pixelBuffer = new Uint32Array(
        context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
      );
      return !pixelBuffer.some(color => color !== 0);
    }

    function initSignature(){
      setupSignatureCanvas();
      const canvas = signaturePadState.canvas;
      if(!canvas) return;

      canvas.addEventListener('pointerdown', startSignature, {passive:false});
      canvas.addEventListener('pointermove', drawSignature, {passive:false});
      canvas.addEventListener('pointerup', stopSignature);
      canvas.addEventListener('pointercancel', stopSignature);
      canvas.addEventListener('pointerleave', stopSignature);
    }

    function registerServiceWorker(){
      if(window.self !== window.top) return;
      if(window.FSMOBILE_EMBEDDED_MODULE) return;
      if(!('serviceWorker' in navigator)) return;

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      navigator.serviceWorker.register('./service-worker.js?v=2026.06.07-02').then(registration => {
        registration.update();

        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if(!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
              newWorker.postMessage({type:'SKIP_WAITING'});
            }
          });
        });

        window.addEventListener('focus', () => registration.update());
        setInterval(() => registration.update(), 60 * 60 * 1000);
      }).catch(error => console.warn('Service Worker konnte nicht registriert werden:', error));
    }

    window.addEventListener('load', () => {
      initSignature();
      restoreFromStorage();

      document.addEventListener('input', scheduleStorageSave, true);
      document.addEventListener('change', scheduleStorageSave, true);
      document.getElementById('archiveOverlay').addEventListener('click', event => {
        if(event.target === event.currentTarget){
          closeArchive();
        }
      });
      document.addEventListener('keydown', event => {
        if(event.key === 'Escape' && !document.getElementById('archiveOverlay').hidden){
          closeArchive();
        }
      });

      registerServiceWorker();
    });

    window.addEventListener('resize', () => {
      window.clearTimeout(window.__signatureResizeTimer);
      window.__signatureResizeTimer = window.setTimeout(setupSignatureCanvas, 180);
    });
  </script>
</body>
</html>

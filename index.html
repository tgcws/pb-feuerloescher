<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prüfbericht Feuerlöscher</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6001c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
#signaturePad{border:2px solid #ccc;width:100%;max-width:500px;height:180px;touch-action:none;background:#fff;}
</style>


  <style>
    body{
      font-family: Arial, sans-serif;
      margin:20px;
      background:#f4f4f4;
      color:#222;
    }

    .container{
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h1{
      text-align:left;
      margin-bottom:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    
    .title-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .logo{
      max-height:80px;
      width:auto;
    }


    .header-left{
      flex:1;
      min-width:250px;
    }

    .header-row{
      display:flex;
      gap:15px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .field{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:150px;
    }

    label{
      font-size:18px;
      font-weight:bold;
      margin-bottom:5px;
    }

    input[type="text"],
    input[type="date"],
    textarea,
    select{
      border:none;
      border-radius:8px;
      font-size:18px;
      box-sizing:border-box;
    }

    input[type="text"],
    input[type="date"],
    textarea{
      padding:8px;
    }

    /* Dropdowns */
    select{
      padding:5px 10px;
      min-width:90px;
      height:36px;
      font-size:14px;  
	  font-weight:bold;

    }

    .table-wrapper{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:25px;
      min-width:1750px;
    }

    th, td{
      border:2px solid #FFFFFF;
	  border-radius:5px;
      background:#F5F5F5;
      padding:15px;
      text-align:center;
      vertical-align:middle;
    }

    th{
      background:#d6001c;
      color:white;
      font-size:15px;
      white-space:normal;
    }

    td input[type="text"]{
      width:100%;
      padding:10px;
	  font-size:14px;	  
	  font-weight:bold;
    }

    /* POS Feld */
    .pos-field{
      width:35px !important;
      text-align:center;
      font-weight:bold;
    }

    /* Baujahr Feld */
    .baujahr-field{
      width:80px !important;
      text-align:center;
      font-weight:bold;
    }
	
    /* Löschmittel Feld */
    .loeschmittel-field{
      width:100px !important;
      text-align:center;
      font-weight:bold;
    }
	
    /* Standortfeld */
    .standort-field{
      min-width:290px;
      resize:horizontal;
      overflow:auto;
    }
	
    /* Typ Feld */
    .type-field{
      width:85px !important;
      text-align:center;
      font-weight:bold;
    }

    .checkbox-center{
      text-align:center;
    }

    .actions{
      margin-top:20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      background:#d6001c;
      color:white;
      border:none;
      padding:16px 14px;
      border-radius:23px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    button:hover{
      background:#a80016;
    }

    .signature{
      margin-top:90px;
	  font-size:16px;
      font-weight:bold;
    }

    @page{
      size: landscape;
      margin: 0;
    }
	
	@media print {
	    html, body {
			margin: 0 !important;
			padding: 0 !important;
        }

	 *{
	   -webkit-print-color-adjust: exact !important;
	   print-color-adjust: exact !important;
	   color-adjust: exact !important;
     }

	 th{
      background: #d6001c !important;
      color: #ffffff !important;
     }

     td{
      background: #F5F5F5 !important;
     }

     button{
      display:none;
     }

     body{
      background:white;
     }

     .container{
      box-shadow:none;
     }
    }
  
input[type="checkbox"]{
  -webkit-appearance: checkbox !important;
  appearance: checkbox !important;
  width: 28px;
  height: 28px;
  cursor: pointer;
}

</style>
</head>

  <div class="header-left">

    <div class="header-left">

      <div class="header-row">
        <div class="field">
          <label>Objekt</label>
          <input type="text" placeholder="Objekt eingeben">
        </div>

        <div class="field">
          <label>Datum</label>
          <input type="date">
        </div>
      </div>

      <div class="header-row">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Name eingeben">
        </div>
      </div>

    </div>

  </div>

  <div class="table-wrapper">

    <table id="reportTable">

      <thead>
        <tr>
          <th>Pos.</th>
          <th>Standort</th>
          <th>Typ</th>
          <th>Baujahr</th>

          <th>Außeninspektion</th>

          <th>Innenkontrolle</th>

          <th>BetrSichV<br>Kategorie I-II</th>

          <th>Schlauchprüfung</th>

          <th>Reinigung</th>

          <th>Druck-/Dichtheit</th>

          <th>Löschmittel<br>Tausch bis</th>

          <th>Prüfplakette</th>
        </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>

    </table>

  </div>

  <div class="actions">
    <button onclick="addRow()">Zeile hinzufügen</button>
    <button onclick="removeRow()">Letzte Zeile entfernen</button>
    <button onclick="printReport()">Drucken</button>
  </div>

<h3>Digitale Unterschrift</h3>
<canvas id="signaturePad" width="500" height="180"></canvas><br>
<button onclick="clearSignature()">Unterschrift löschen</button>
</div>

    <label>Unterschrift</label>
  </div>

</div>

<script>

  function createSelect(options) {

    let select = document.createElement("select");

    options.forEach(optionText => {
      let option = document.createElement("option");
      option.text = optionText;
      select.add(option);

    return select;

<div class="actions"><button onclick="saveReport()">Bericht speichern</button><button onclick="exportPDF()">PDF archivieren</button></div>
<script>
let reports=JSON.parse(localStorage.getItem('reports')||'[]');

function exportPDF(){
 const obj=document.querySelector('input[placeholder="Objekt eingeben"]')?.value||'Objekt';
 const date=document.querySelector('input[type="date"]')?.value||new Date().toISOString().split('T')[0];
 html2pdf().set({filename:`${obj}_${date}_Pruefbericht.pdf`}).from(document.querySelector('.container')).save();
}

function saveReport(){
 const data=document.documentElement.outerHTML;
 const name=(document.querySelector('input[placeholder="Objekt eingeben"]')?.value||'Objekt')+'_'+Date.now();
 reports.push({name,data,date:new Date().toISOString()});
 localStorage.setItem('reports',JSON.stringify(reports));
 alert('Bericht gespeichert');
}

function initSignature(){
 const c=document.getElementById('signaturePad');
 if(!c) return;
 const ctx=c.getContext('2d');
 let draw=false;
 function pos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
 }
 ['pointerdown'].forEach(ev=>c.addEventListener(ev,e=>{draw=true;let p=pos(e);ctx.moveTo(p.x,p.y);}));
 ['pointermove'].forEach(ev=>c.addEventListener(ev,e=>{if(!draw)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}));
 window.addEventListener('pointerup',()=>draw=false);
}
function clearSignature(){
 const c=document.getElementById('signaturePad');
 c.getContext('2d').clearRect(0,0,c.width,c.height);
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
window.addEventListener('load',initSignature);
</script>
